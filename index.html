
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frendly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    .font-quicksand {
      font-family: 'Quicksand', sans-serif;
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.02); }
    }
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes rain {
      0% { transform: translateY(-100vh); }
      100% { transform: translateY(100vh); }
    }
    @keyframes snow {
      0% { transform: translateY(-10vh) translateX(0); }
      50% { transform: translateY(50vh) translateX(-15px); }
      100% { transform: translateY(110vh) translateX(0); }
    }
    @keyframes drift {
      from { transform: translateX(-5%); }
      to { transform: translateX(5%); }
    }
    @keyframes mist {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.5; }
    }

    .animate-pulse-soft {
      animation: pulse-soft 4s ease-in-out infinite;
    }
    .animate-bounce-slow {
      animation: bounce-slow 4s ease-in-out infinite;
    }
    .animate-rain {
      animation: rain 0.8s linear infinite;
    }
    .animate-snow {
      animation: snow 5s linear infinite;
    }
    .animate-drift {
      animation: drift 25s ease-in-out infinite alternate;
    }
    .animate-mist {
      animation: mist 10s ease-in-out infinite;
    }
    
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lottie-web": "https://esm.sh/lottie-web@5.12.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 transition-colors duration-1000">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
